worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    upstream user_service { server user-service:8081; }
    upstream wallet_service { server wallet-service:8082; }
    upstream transaction_service { server transaction-service:8083; }
    upstream web_app { server web:3000; }

    server {
        listen 80;
        server_name _;

        location /user-service/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header requestId $http_requestid;
        }

        location /wallet-service/ {
            proxy_pass http://wallet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Signature $http_x_signature;
            proxy_set_header requestId $http_requestid;
        }

        location /transaction-service/ {
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header requestId $http_requestid;
        }

        location /swagger-user/ {
            proxy_pass http://user_service/swagger-ui/;
        }

        location / {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
