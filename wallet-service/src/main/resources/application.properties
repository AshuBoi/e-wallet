server.port=${SERVER_PORT:8082}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/walletdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.bootstrapAddress=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-key-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:9080}

payment.provider=${PAYMENT_PROVIDER:mock}
payment.public-base-url=${PAYMENT_PUBLIC_BASE_URL:http://localhost:9080}
wallet.initial-balance=${WALLET_INITIAL_BALANCE:100.00}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [requestId=%X{requestId}] %-5level %logger{36} - %msg%n
